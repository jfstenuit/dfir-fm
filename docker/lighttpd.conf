# DFIR FM: lighttpd in front of PHP-FPM (same container), plain HTTP on 8080.
# The rewrite rules mirror .htaccess (and tests/Support/router.php): keep them in step.

server.modules = (
    "mod_rewrite",
    "mod_setenv",
    "mod_fastcgi",
    "mod_accesslog"
)

server.document-root = "/var/www/html"
server.port = 8080
server.username = "www-data"
server.groupname = "www-data"
server.tag = ""

# Logs to the container output
accesslog.filename = "/dev/stdout"
server.errorlog = "/dev/stderr"

# Types of the static files the rules below let through. lighttpd has no
# default list. A module script (.mjs: Dropzone) served with another type is
# refused by browsers.
mimetype.assign = (
    ".css"   => "text/css; charset=utf-8",
    ".js"    => "text/javascript; charset=utf-8",
    ".mjs"   => "text/javascript; charset=utf-8",
    ".map"   => "application/json",
    ".woff2" => "font/woff2",
    ".woff"  => "font/woff",
    ".ttf"   => "font/ttf",
    ".otf"   => "font/otf",
    ".eot"   => "application/vnd.ms-fontobject",
    ".svg"   => "image/svg+xml",
    ".png"   => "image/png",
    ".jpg"   => "image/jpeg",
    ".jpeg"  => "image/jpeg",
    ".gif"   => "image/gif",
    ".webp"  => "image/webp",
    ".ico"   => "image/x-icon"
)

# Routing, first match wins. The patterns see the path and the query string,
# so they stop the path at "?".
#  1. storage/, src/, bin/, docker/, tests/ and dotfiles: 404 (rewritten to a
#     path that doesn't exist)
#  2. static files under assets/ and the build folders of the three front-end
#     packages: served as they are (a missing one is a 404)
#  3. anything else under assets/ or vendor/: 404
#  4. everything else: index.php, which routes on the original REQUEST_URI
url.rewrite-once = (
    "^/(storage|src|bin|docker|tests)(/|\?|$)" => "/.not-found",
    "^[^?]*/\."                                 => "/.not-found",
    "^(/(assets/|vendor/twbs/bootstrap/dist/|vendor/twbs/bootstrap-icons/font/|vendor/enyo/dropzone/dist/)[^?]+\.(css|js|mjs|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico))(\?.*)?$" => "$1$4",
    "^/(assets|vendor)(/|\?|$)"                 => "/.not-found",
    "^[^?]*(\?.*)?$"                            => "/index.php$1"
)

# Same headers as index.php sends, for the static files
$HTTP["url"] =~ "^/(assets|vendor)/" {
    setenv.set-response-header = (
        "X-Content-Type-Options" => "nosniff",
        "Referrer-Policy" => "same-origin"
    )
}

# PHP: only index.php is ever reached (rule 4)
fastcgi.server = ( ".php" =>
    ((
        "host" => "127.0.0.1",
        "port" => 9000,
        "check-local" => "enable",
        "broken-scriptfilename" => "enable"
    ))
)
