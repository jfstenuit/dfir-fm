# DFIR FM. From this directory: docker compose pull && docker compose up -d
# Then create the first administrator (prints a random password once):
#   docker compose exec -u www-data app php bin/create-admin.php you@yourdomain.com
#
# Configuration: docker/.env, to create before the first start: copy the
# project's env.sample there and uncomment its Docker settings. Compose reads
# it (image_tag, files_dir, log_dir, http_port, uid, gid) and the container
# gets it as the application's .env. It must be readable by the container's
# www-data user (uid/gid 82, or uid and gid if set). Change settings there,
# not in this file, which an upgrade replaces.
# See README.md, "Installation", and
# https://github.com/jfstenuit/dfir-fm/blob/main/DEVELOPER.md#docker
services:
  app:
    # The released image: this file's release, or image_tag if set (e.g. 1,
    # the latest 1.x release). From a checkout, "docker compose up -d --build"
    # builds it from the code instead, under the same name. The install bundle
    # of a release has no build section.
    image: ghcr.io/jfstenuit/dfir-fm:${image_tag:-1.0.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      # start.sh gives www-data this uid/gid, so that host directories
      # (files_dir, log_dir) owned by that user need no chown (default 82),
      # and hands the volumes over to it, but not the host directories
      APP_UID: ${uid:-82}
      APP_GID: ${gid:-82}
      APP_FILES_DIR: ${files_dir:-}
      APP_LOG_DIR: ${log_dir:-}
    ports:
      # Plain HTTP: publish it on the loopback interface only and put a
      # TLS-terminating reverse proxy in front (trusted_proxies, force_https).
      # The host port is http_port if set, otherwise 8080
      - "127.0.0.1:${http_port:-8080}:8080"
    volumes:
      # Configuration. In the container, base_storage_directory, database_path,
      # events_database_path and log_file_path are set by the image
      # (/data/...): the host paths in the file are ignored.
      - type: bind
        source: ./.env
        target: /var/www/html/.env
        read_only: true
        bind:
          create_host_path: false
      # Evidence (storage_engine=local): the host directory files_dir if set,
      # otherwise the volume dfir-fm-files
      - ${files_dir:-dfir-fm-files}:/data/files
      # Events database and log file (log_engine=file): the host directory
      # log_dir if set, otherwise the volume dfir-fm-logs. It holds the
      # events (chain of custody): back it up
      - ${log_dir:-dfir-fm-logs}:/data/logs
      # Database: always a volume (back it up)
      - dfir-fm-database:/data/database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  dfir-fm-database:
    name: dfir-fm-database
  dfir-fm-files:
    name: dfir-fm-files
  dfir-fm-logs:
    name: dfir-fm-logs
