; DFIR FM pool settings, loaded after the image's own (docker.conf, zz-docker.conf)

[global]
; Log events (log_engine=stderr) are JSON lines longer than the default 1024 bytes
log_limit = 16384

[www]
; Only lighttpd, in the same container, talks to PHP-FPM
listen = 127.0.0.1:9000
; Pass the DFIRFM_* configuration variables to PHP
clear_env = no
; lighttpd logs the requests
access.log = /dev/null
