; DFIR FM pool settings, loaded after the image's own (docker.conf, zz-docker.conf)

[global]
; Log events (log_engine=stderr) are JSON lines longer than the default 1024 bytes
log_limit = 16384

[www]
; Only lighttpd, in the same container, talks to PHP-FPM
listen = 127.0.0.1:9000
; Pass the DFIRFM_* configuration variables to PHP
clear_env = no
; lighttpd logs the requests
access.log = /dev/null

; Workers. Each request holds one for its whole duration, and some last long:
; an upload's verification (hashing the stored file: minutes to hours for a
; disk image; at most upload_max_verifications per user, default 1), every
; download (until the last byte is sent), and the status polls of the upload
; dialog (one per second per verifying file). The image's default of 5 is
; used up by a few users downloading at once; then every page waits.
; Size max_children for: concurrent downloads + concurrent verifications +
; a few for pages and polls. Memory per idle worker is ~20-40 MB; a busy one
; at most memory_limit (128M), which downloads and hashing don't approach.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; No request time limit: a verification of a large disk image takes longer
; than any fixed limit, and a killed verification only restarts from zero
; (status polls after 120 s without progress). Abandoned uploads expire
; (upload_stale_after); a download ends when its client goes away.
request_terminate_timeout = 0
