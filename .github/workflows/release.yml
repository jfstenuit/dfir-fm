# When a release is published (gh release create vX.Y.Z): run the tests,
# build the image and push it to ghcr.io/<owner>/dfir-fm (tags X.Y.Z, X.Y, X,
# latest; a prerelease gets X.Y.Z only), then attach to the release:
#   dfir-fm-docker.tar.gz           the install bundle: README, LICENSE,
#                                   env.sample and docker/docker-compose.yml,
#                                   set to this release's image, without its
#                                   build section
#   dfir-fm-image-X.Y.Z-amd64.tar.gz  the image (docker save), for air-gapped
#                                   hosts
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation on the amd64 runner (slow: APCu and GMP
      # are compiled)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags from the release's tag (v1.2.3 gives 1.2.3, 1.2, 1 and latest),
      # and the OCI labels, source included, which link the package to the
      # repository
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  assets:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bundle
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p bundle/dfir-fm/docker
          cp README.md LICENSE.md env.sample bundle/dfir-fm/
          sed -e "s|\${image_tag:-[^}]*}|\${image_tag:-$version}|" \
              -e '/^    build:$/,/^      dockerfile:/d' \
              docker/docker-compose.yml > bundle/dfir-fm/docker/docker-compose.yml
          grep -q "image_tag:-$version}" bundle/dfir-fm/docker/docker-compose.yml
          ! grep -q 'build:' bundle/dfir-fm/docker/docker-compose.yml
          tar -C bundle -czf dfir-fm-docker.tar.gz dfir-fm
          gh release upload "$GITHUB_REF_NAME" dfir-fm-docker.tar.gz --clobber

      # The package is private until made public (first release)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image archive
        run: |
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}:$version
          docker pull --platform linux/amd64 "$image"
          docker save "$image" | gzip > "dfir-fm-image-$version-amd64.tar.gz"
          gh release upload "$GITHUB_REF_NAME" "dfir-fm-image-$version-amd64.tar.gz" --clobber
